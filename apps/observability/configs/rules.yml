groups:
  - name: demo
    interval: 15s
    rules:
      - alert: DemoApiDown
        expr: up{app="demo"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the demo API /metrics endpoint.

      - alert: DemoHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of demo API requests are 5xx.
